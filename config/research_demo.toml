# Configuración de DEMOSTRACIÓN sobre datos SINTÉTICOS (no es el estudio pre-registrado).
# Sirve para probar el pipeline de punta a punta en minutos:
#   tbot data synth --days 200 && tbot research run --symbol SYNTH --config config/research_demo.toml

[study]
symbols = ["SYNTH"]
horizons = [1, 5]
data_start = "2023-01-01"
dev_test_start = "2023-03-01"
holdout_start = "2023-07-01"
holdout_end = "2023-07-20"
step_months = 1
train_months = 2
calib_frac = 0.2
max_fit_rows = 100000

[contracts]
binary_payout = 0.85
binary_tie_rule = "refund"
binary_ev_margin = 0.02
spot_ev_margin_frac = 0.25
payout_grid = [0.70, 0.80, 0.85, 0.92]

[execution]
latency_median_s = 3.0
latency_sigma = 0.5
max_age_base_s = 20.0
p_disconnect = 0.01
seed = 2024

[acceptance]
min_trades = 300
alpha = 0.05
min_positive_fold_frac = 0.60
max_fold_profit_share = 0.50
coverage_levels = [0.5, 0.2, 0.1, 0.05, 0.01]
target_accuracy = 0.80
min_n_for_accuracy_claim = 100
