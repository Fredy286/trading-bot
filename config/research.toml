# Configuración del estudio pre-registrado (docs/01_informe_investigacion_fase1a.md, sección 8).
# Cambiar cualquier valor después de ver resultados debe justificarse en docs/04_registro_de_errores.md.

[study]
symbols = ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "XAUUSD", "BTCUSDT"]
horizons = [1, 5, 15, 60]
data_start = "2021-01-01"
dev_test_start = "2022-01-01"
holdout_start = "2025-09-01"
holdout_end = "2026-09-01"
step_months = 3
train_months = 12
calib_frac = 0.2
max_fit_rows = 400000

[contracts]
binary_payout = 0.85
binary_tie_rule = "refund"
binary_ev_margin = 0.02        # política B: EV estimado ≥ 0,02 unidades de apuesta
spot_ev_margin_frac = 0.25     # política B: EV estimado ≥ 0,25 × costo estimado
payout_grid = [0.70, 0.75, 0.80, 0.85, 0.90, 0.92, 0.95]

[execution]
latency_median_s = 3.0         # alerta + orden automatizada (manual: 10–30 s)
latency_sigma = 0.5
max_age_base_s = 20.0          # vigencia mínima de una señal; se amplía a 1/3 del horizonte
p_disconnect = 0.01
seed = 2024

[acceptance]
min_trades = 300
alpha = 0.05
min_positive_fold_frac = 0.60
max_fold_profit_share = 0.50
coverage_levels = [0.5, 0.2, 0.1, 0.05, 0.01, 0.001]
target_accuracy = 0.80
min_n_for_accuracy_claim = 100
