[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Investigación cuantitativa y alertas de dirección de precio con validación honesta (sin promesas de acierto)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradingbot = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
