name: Diagnóstico de fuentes

# Se ejecuta a mano o con un commit cuyo mensaje contenga [diagnose].
on:
  workflow_dispatch:
  push:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: tbot data probe
        timeout-minutes: 8
      - name: Bolsas en USDT del blitz (¿responden desde los servidores de GitHub?)
        timeout-minutes: 3
        run: |
          for u in \
            "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2" \
            "https://data.binance.vision/data/spot/daily/klines/BTCUSDT/1m/BTCUSDT-1m-2026-11-01.zip" \
            "https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=1&limit=2" \
            "https://www.okx.com/api/v5/market/history-candles?instId=BTC-USDT&bar=1m&limit=2" \
            "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=BTC_USDT&interval=1m&limit=2" \
            "https://download.gatedata.org/spot/candlesticks_1m/202611/BTC_USDT-20261101.csv.gz"; do
            echo "$(curl -s -o /tmp/r -w '%{http_code}' --max-time 20 "$u") $(head -c 120 /tmp/r | tr -d '\n') ← $u"
          done
      - name: Cabeceras completas de Dukascopy (curl)
        timeout-minutes: 3
        run: |
          curl -sS --max-time 30 -D - -o /dev/null -A "Mozilla/5.0" "https://datafeed.dukascopy.com/datafeed/EURUSD/2021/00/05/BID_candles_min_1.bi5" || true
          sleep 2
          curl -sS --max-time 30 -D - -o /dev/null "https://datafeed.dukascopy.com/datafeed/EURUSD/2021/00/05/10h_ticks.bi5" || true
